unit_tests:

  - name: scoring_scenarios
    model: fct_fishing_conditions
    given:
      - input: ref('scoring_curves')
        format: csv
        fixture: scoring_curves
      - input: ref('lake_seasons')
        format: csv
        fixture: lake_seasons
      - input: ref('stg_weather_latest')
        rows:
          - {lake: "ideal_april_morning", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 15, cloud_cover_pct: 80, precipitation_mm: 0, is_day: 1}
          - {lake: "hot_bright_calm_july", forecast_time: "2026-07-15 12:00:00", temperature_c: 24, pressure_hpa: 1015, wind_speed_mph: 1, wind_gust_mph: 3, cloud_cover_pct: 5, precipitation_mm: 0, is_day: 1}
          - {lake: "gale", forecast_time: "2026-04-15 07:00:00", temperature_c: 10, pressure_hpa: 1015, wind_speed_mph: 35, wind_gust_mph: 45, cloud_cover_pct: 90, precipitation_mm: 0, is_day: 1}
          - {lake: "boat_stop_25mph", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 25, wind_gust_mph: 28, cloud_cover_pct: 80, precipitation_mm: 0, is_day: 1}
          - {lake: "light_rain", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 15, cloud_cover_pct: 80, precipitation_mm: 0.4, is_day: 1}
          - {lake: "moderate_rain", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 15, cloud_cover_pct: 80, precipitation_mm: 2, is_day: 1}
          - {lake: "heavy_rain", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 15, cloud_cover_pct: 80, precipitation_mm: 8, is_day: 1}
          - {lake: "freezing_march", forecast_time: "2026-03-10 11:00:00", temperature_c: 1, pressure_hpa: 1015, wind_speed_mph: 8, wind_gust_mph: 12, cloud_cover_pct: 70, precipitation_mm: 0, is_day: 1}
          - {lake: "night_hour", forecast_time: "2026-04-15 02:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 15, cloud_cover_pct: 80, precipitation_mm: 0, is_day: 0}
          - {lake: "Chew Valley Lake", forecast_time: "2026-12-10 11:00:00", temperature_c: 8, pressure_hpa: 1015, wind_speed_mph: 8, wind_gust_mph: 12, cloud_cover_pct: 70, precipitation_mm: 0, is_day: 1}
    expect:
      rows:
        - {lake: "ideal_april_morning", fishing_score: 100, rating: good}
        - {lake: "hot_bright_calm_july", fishing_score: 41, rating: poor}
        - {lake: "gale", fishing_score: 5, rating: very_poor}
        - {lake: "boat_stop_25mph", fishing_score: 20, rating: very_poor}
        - {lake: "light_rain", fishing_score: 100, rating: good}
        - {lake: "moderate_rain", fishing_score: 60, rating: fair}
        - {lake: "heavy_rain", fishing_score: 10, rating: very_poor}
        - {lake: "freezing_march", fishing_score: 40, rating: poor}
        - {lake: "night_hour", fishing_score: 85, rating: dark}
        - {lake: "Chew Valley Lake", fishing_score: 87, rating: closed}

  - name: gust_curve_has_no_cliff
    model: fct_fishing_conditions
    given:
      - input: ref('scoring_curves')
        format: csv
        fixture: scoring_curves
      - input: ref('lake_seasons')
        format: csv
        fixture: lake_seasons
      - input: ref('stg_weather_latest')
        rows:
          - {lake: "gust_24_9", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 24.9, cloud_cover_pct: 80, precipitation_mm: 0, is_day: 1}
          - {lake: "gust_25_1", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, wind_gust_mph: 25.1, cloud_cover_pct: 80, precipitation_mm: 0, is_day: 1}
    expect:
      rows:
        - {lake: "gust_24_9", fishing_score: 55}
        - {lake: "gust_25_1", fishing_score: 55}
