unit_tests:

  - name: ideal_april_morning_scores_100
    model: fct_fishing_conditions
    given:
      - input: ref('scoring_bands')
        format: csv
        fixture: scoring_bands
      - input: ref('lake_seasons')
        format: csv
        fixture: lake_seasons
      - input: ref('stg_weather_latest')
        rows:
          - {lake: "Chew Valley Lake", forecast_time: "2026-04-15 07:00:00", temperature_c: 12, pressure_hpa: 1015, wind_speed_mph: 10, cloud_cover_pct: 80, precipitation_mm: 0, is_day: 1}
    expect:
      rows:
        - {fishing_score: 100, rating: good}

