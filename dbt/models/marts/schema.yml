version: 2

models:
  - name: fct_fishing_conditions
    description: "Hourly fly fishing score (0-100) for each lake"
    columns:
      - name: fishing_score
        description: "100 minus the weather penalties, never below 0"
        data_tests:
          - not_null
      - name: rating
        description: "good (75+), fair (50-74) or poor (below 50)"
        data_tests:
          - accepted_values:
              arguments:
                values: ["good", "fair", "poor"]
